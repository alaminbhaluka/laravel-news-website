name: Build Tribune Bangla WordPress theme

on:
  workflow_dispatch:
  push:
    branches:
      - wordpress-theme-foundation
    paths:
      - 'wp-content/themes/tribune-bangla/**'
      - '.github/workflows/build-wordpress-packages.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wordpress-theme-foundation

      - name: Set up PHP for syntax checks
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find wp-content/themes/tribune-bangla -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build theme ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f wp-content/themes/tribune-bangla/style.css
          test -f wp-content/themes/tribune-bangla/functions.php
          mkdir -p dist
          cd wp-content/themes
          zip -qr ../../dist/tribune-bangla-theme.zip tribune-bangla
          cd ../../
          sha256sum dist/tribune-bangla-theme.zip > dist/SHA256SUMS.txt

      - name: Upload theme package
        uses: actions/upload-artifact@v4
        with:
          name: tribune-bangla-theme
          path: dist/
          if-no-files-found: error
          retention-days: 30
